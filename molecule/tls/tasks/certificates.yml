---
# Generate the test CA and every certificate it signs on the control machine.
# These tasks run in the `hosts: localhost` play of prepare.yml and write to
# `tls_src_dir` only. Nothing here touches the target.
#
# Layout of tls_src_dir:
#   ca.key, ca.crt           Test CA. The key never leaves the control machine.
#   client.key, client.crt   Client certificate. The role uploads these to the
#                            target during converge.
#   postgresql/server.*      PostgreSQL server certificate. postgresql_tls.yml
#                            uploads it.
#   redis/server.*           Redis server certificate. redis_tls.yml uploads it.
#
# Every command has `creates:`, so a second `molecule prepare` reuses the CA
# and the client and server certificates keep chaining to it.

- name: Create certificate directories
  file:
    path: "{{ tls_src_dir }}/{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - ""
    - postgresql
    - redis

# ============ CA ============
- name: Generate CA private key
  command: openssl genrsa -out {{ tls_src_dir }}/ca.key 4096
  args:
    creates: "{{ tls_src_dir }}/ca.key"

- name: Generate CA certificate
  command: >
    openssl req -x509 -new -nodes
    -key {{ tls_src_dir }}/ca.key
    -sha256 -days 365
    -out {{ tls_src_dir }}/ca.crt
    -subj "/CN=Test-CA"
  args:
    creates: "{{ tls_src_dir }}/ca.crt"

# ============ Client certificate ============
- name: Generate client private key
  command: openssl genrsa -out {{ tls_src_dir }}/client.key 2048
  args:
    creates: "{{ tls_src_dir }}/client.key"

- name: Create client certificate config
  copy:
    content: |
      [req]
      distinguished_name = req_distinguished_name
      req_extensions = v3_req
      prompt = no

      [req_distinguished_name]
      CN = miarec

      [v3_req]
      keyUsage = digitalSignature
      extendedKeyUsage = clientAuth
    dest: "{{ tls_src_dir }}/client.cnf"
    mode: "0644"

- name: Generate client CSR
  command: >
    openssl req -new
    -key {{ tls_src_dir }}/client.key
    -out {{ tls_src_dir }}/client.csr
    -config {{ tls_src_dir }}/client.cnf
  args:
    creates: "{{ tls_src_dir }}/client.csr"

- name: Sign client certificate with CA
  command: >
    openssl x509 -req
    -in {{ tls_src_dir }}/client.csr
    -CA {{ tls_src_dir }}/ca.crt
    -CAkey {{ tls_src_dir }}/ca.key
    -CAcreateserial
    -out {{ tls_src_dir }}/client.crt
    -days 365 -sha256
    -extensions v3_req
    -extfile {{ tls_src_dir }}/client.cnf
  args:
    creates: "{{ tls_src_dir }}/client.crt"

# ============ Server certificates ============
# PostgreSQL and Redis run on the target and listen on the loopback interface,
# so both certificates are issued for localhost.
- name: Generate server private key
  command: openssl genrsa -out {{ tls_src_dir }}/{{ item }}/server.key 2048
  args:
    creates: "{{ tls_src_dir }}/{{ item }}/server.key"
  loop: [postgresql, redis]

- name: Create server certificate config
  copy:
    content: |
      [req]
      distinguished_name = req_distinguished_name
      req_extensions = v3_req
      prompt = no

      [req_distinguished_name]
      CN = localhost

      [v3_req]
      keyUsage = keyEncipherment, dataEncipherment
      extendedKeyUsage = serverAuth
      subjectAltName = @alt_names

      [alt_names]
      DNS.1 = localhost
      IP.1 = 127.0.0.1
    dest: "{{ tls_src_dir }}/{{ item }}/server.cnf"
    mode: "0644"
  loop: [postgresql, redis]

- name: Generate server CSR
  command: >
    openssl req -new
    -key {{ tls_src_dir }}/{{ item }}/server.key
    -out {{ tls_src_dir }}/{{ item }}/server.csr
    -config {{ tls_src_dir }}/{{ item }}/server.cnf
  args:
    creates: "{{ tls_src_dir }}/{{ item }}/server.csr"
  loop: [postgresql, redis]

- name: Sign server certificate with CA
  command: >
    openssl x509 -req
    -in {{ tls_src_dir }}/{{ item }}/server.csr
    -CA {{ tls_src_dir }}/ca.crt
    -CAkey {{ tls_src_dir }}/ca.key
    -CAcreateserial
    -out {{ tls_src_dir }}/{{ item }}/server.crt
    -days 365 -sha256
    -extensions v3_req
    -extfile {{ tls_src_dir }}/{{ item }}/server.cnf
  args:
    creates: "{{ tls_src_dir }}/{{ item }}/server.crt"
  loop: [postgresql, redis]
