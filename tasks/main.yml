---
# ---------------------------------------------
# Prepare for run (includes Python version detection)
# ---------------------------------------------
- import_tasks: preflight.yml


# ---------------------------------------------
# Install dependencies
# ---------------------------------------------
- import_tasks: dependencies.yml
  become: true

# ---------------------------------------------
# Install uv (optional, tagged)
# ---------------------------------------------
- import_tasks: install_uv.yml
  when: miarecweb_install_uv | bool
  tags: uv
  become: true

# --------------------------------------------------
# Create "miarec" group if necesasry
# --------------------------------------------------
- name: "Add miarec group '{{ miarec_bin_group }}'"
  group:
    name: "{{ miarec_bin_group }}"
    state: present
  when: miarec_bin_group != 'root'
  become: true

# --------------------------------------------------
# Upload TLS files (optional)
# A file is uploaded when its *_src variable is set. The private keys get
# the group created above. The role sets permissions only on the files it
# uploads; a file that is already on the host is left as is, and
# tls_verify.yml below fails the play when a service user cannot read it.
# --------------------------------------------------
- import_tasks: tls.yml
  when: miarecweb_db_tls | bool or miarecweb_redis_tls | bool
  become: true

# --------------------------------------------------
# Initialize the installation/upgrade process
# --------------------------------------------------
- name: Initialize the deploy root and gather facts
  deploy_helper:
    path: "{{ miarecweb_install_dir }}"
    release: "{{ miarecweb_version }}"
    mode: u=rwX,g=rX,o=rX
  become: true

# --------------------------------------------------
# Install/upgrade 'miarecweb' app files
# --------------------------------------------------
- import_tasks: miarecweb.yml
  become: true

# --------------------------------------------------
# Upgrade database layout
# --------------------------------------------------
- import_tasks: upgrade_db.yml
  when: miarecweb_upgrade_db|bool
  become: true

# --------------------------------------------------
# Configure apache web server
# --------------------------------------------------
- import_tasks: apache.yml
  when: miarecweb_install_apache|bool
  become: true

# --------------------------------------------------
# Configure celery + celerybeat
# --------------------------------------------------
- import_tasks: celeryd.yml
  when: miarecweb_install_celeryd|bool
  become: true

- import_tasks: celerybeat.yml
  when: miarecweb_install_celerybeat|bool
  become: true

# --------------------------------------------------
# Verify the service users can read the TLS files
# Runs after the Apache and Celery users exist and before the
# release is finalized, so a failure leaves the previous
# release active and the services untouched.
# --------------------------------------------------
- import_tasks: tls_verify.yml
  when: miarecweb_db_tls | bool or miarecweb_redis_tls | bool
  become: true

# --------------------------------------------------
# Cleanup old and unfinished releases
# --------------------------------------------------
- name: Cleanup old releases
  deploy_helper:
    path: "{{ miarecweb_install_dir }}"
    release: "{{ ansible_facts['deploy_helper']['new_release'] }}"
    state: finalize
    keep_releases: 10
  notify:
    - reload apache
    - reload celeryd
    - reload celerybeat
    - start apache
    - start celeryd
    - start celerybeat
  become: true

# --------------------------------------------------
# Re-normalize sources after services were restarted
# --------------------------------------------------
- name: Flush handlers before normalizing sources
  meta: flush_handlers

- name: Check MiaRecWeb source directory
  stat:
    path: "{{ ansible_facts['deploy_helper']['new_release_path'] }}/app"
  register: _miarecweb_source_dir
  become: true

- name: Normalize permissions on MiaRecWeb sources
  file:
    path: "{{ ansible_facts['deploy_helper']['new_release_path'] }}/app"
    state: directory
    recurse: true
    mode: u=rwX,g=rX,o=rX
  when: _miarecweb_source_dir.stat.exists
  become: true
