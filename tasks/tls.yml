---
# Upload the TLS files from the Ansible control machine. A file is uploaded
# when its miarecweb_*_tls_*_src variable is set. Leave the variable empty
# when the file is already on the host, for example when another tool manages it.
#
# All files are owned by root. Certificates are world readable (0644). Private
# keys are readable by root and miarec_bin_group only (0640).
#
# A missing parent directory is created as 0755 root:root, regardless of the
# umask, so every service can traverse it. An existing directory is never
# changed, because it may be shared with other services, such as
# /etc/ssl/certs or /etc/ssl/private. tls_verify.yml checks later that the
# service users can read the files.
#
# The PostgreSQL and Redis clients often share one CA file. When both point at
# the same source and destination, the file is uploaded once.

- name: Upload TLS files
  vars:
    _miarecweb_db_tls_files:
      - { src: "{{ miarecweb_db_tls_ca_file_src }}", dest: "{{ miarecweb_db_tls_ca_file }}" }
      - { src: "{{ miarecweb_db_tls_cert_file_src }}", dest: "{{ miarecweb_db_tls_cert_file }}" }
      - { src: "{{ miarecweb_db_tls_key_file_src }}", dest: "{{ miarecweb_db_tls_key_file }}", private: true }
    _miarecweb_redis_tls_files:
      - { src: "{{ miarecweb_redis_tls_ca_file_src }}", dest: "{{ miarecweb_redis_tls_ca_file }}" }
      - { src: "{{ miarecweb_redis_tls_cert_file_src }}", dest: "{{ miarecweb_redis_tls_cert_file }}" }
      - { src: "{{ miarecweb_redis_tls_key_file_src }}", dest: "{{ miarecweb_redis_tls_key_file }}", private: true }
    _miarecweb_tls_files: >-
      {{
        (
          (_miarecweb_db_tls_files if miarecweb_db_tls | bool else [])
          + (_miarecweb_redis_tls_files if miarecweb_redis_tls | bool else [])
        ) | selectattr('src') | unique | list
      }}
  block:
    - name: Check which TLS directories exist
      stat:
        path: "{{ item }}"
      loop: "{{ _miarecweb_tls_files | map(attribute='dest') | map('dirname') | unique | list }}"
      register: _miarecweb_tls_dirs

    - name: Create missing TLS directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        mode: "0755"
      loop: "{{ _miarecweb_tls_dirs.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

    - name: Upload TLS certificates and private keys
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: "{{ miarec_bin_group }}"
        mode: "{{ '0640' if item.private | default(false) | bool else '0644' }}"
      loop: "{{ _miarecweb_tls_files }}"
      loop_control:
        label: "{{ item.src | basename }} -> {{ item.dest }}"
      notify:
        - reload apache
        - reload celeryd
        - reload celerybeat
